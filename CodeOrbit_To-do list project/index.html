<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Today’s Tasks</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <h1>Today’s tasks</h1>
  <p class="sub" id="sub"></p>
  <section class="card">
    <div class="progress" aria-hidden="true"><span id="bar"></span></div>
    <form class="add" id="form" autocomplete="off">
      <input id="input" type="text" placeholder="What needs doing?" maxlength="120" aria-label="New task">
      <button type="submit">Add task</button>
    </form>
    <div class="filters" role="group" aria-label="Filter tasks">
      <button data-f="all" aria-pressed="true">All</button>
      <button data-f="active" aria-pressed="false">To do</button>
      <button data-f="done" aria-pressed="false">Done</button>
    </div>
    <ul id="list"></ul>
    <p class="empty" id="empty" hidden></p>
    <div class="foot"><span id="count"></span><button id="clear" type="button">Clear completed</button></div>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
